name: Cập nhật dữ liệu & triển khai (GitHub Pages)

on:
  schedule:
    - cron: '0 0,12 * * *'   # 07:00 và 19:00 giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Thu thập dữ liệu (lỗi nguồn không làm hỏng triển khai)
        run: node tools/update-data.mjs
        continue-on-error: true
      - name: Lưu dữ liệu mới vào kho mã (để lần sau tái sử dụng)
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "chore: cập nhật dữ liệu $(date -u +%F)"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
